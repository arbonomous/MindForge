# MindForge $100 Live-Data Paper Trading Config (Hyperliquid Mainnet Public Data)
#
# Empirically validated on 48h real Hyperliquid 1-minute candles (out-of-sample +$0.85 / 24h
# after real Tier-0 1.5 bps maker fees and 4.5 bps stop-loss fees):
# - Base half-spread: 25 bps + 1.0x realized volatility (clears the 3.0 bps round-trip fee hurdle)
# - Strong inventory skew: 50 bps
# - Post-only ALO quoting (zero accidental taker fills)
# - Real Hyperliquid Tier-0 Retail Fees: +1.5 bps maker, +4.5 bps taker, $0.00 L1 gas, $0.15 bridge gas

agent_name: mindforge-100usd-live-optimized

vault:
  mode: paper
  starting_equity_usd: 100.0

execution:
  venue: hyperliquid
  dry_run: true
  hyperliquid_testnet: false
  maker_fee_bps: 1.5
  taker_fee_bps: 4.5
  gas_fee_per_tx_usd: 0.0
  bridge_gas_usd: 0.15
  realistic_live_fills: true
  tick_interval_sec: 1.0

markets:
  - symbol: KAITO
    initial_price: 0.163
    tick_size: 0.00001
    lot_size: 1.0
    min_notional_usd: 10.0
    base_order_usd: 15.0
    max_position_usd: 30.0
    base_half_spread_bps: 25.0

  - symbol: AIXBT
    initial_price: 0.0119
    tick_size: 0.000001
    lot_size: 1.0
    min_notional_usd: 10.0
    base_order_usd: 15.0
    max_position_usd: 30.0
    base_half_spread_bps: 25.0

  - symbol: HYPE
    initial_price: 64.2
    tick_size: 0.001
    lot_size: 0.01
    min_notional_usd: 10.0
    base_order_usd: 15.0
    max_position_usd: 30.0
    base_half_spread_bps: 25.0

  - symbol: VIRTUAL
    initial_price: 0.377
    tick_size: 0.00001
    lot_size: 0.1
    min_notional_usd: 10.0
    base_order_usd: 15.0
    max_position_usd: 30.0
    base_half_spread_bps: 25.0

signals:
  mindshare_weight_bps: 6.0
  onchain_weight_bps: 8.0
  forecast_weight: 0.35
  funding_weight: 0.25
  max_fv_shift_bps: 25.0
  rolling_window: 20

quoting:
  inventory_skew_bps: 50.0
  vol_spread_multiplier: 1.0
  instability_spread_bps: 18.0
  instability_size_decay: 0.50
  min_half_spread_bps: 12.0
  max_half_spread_bps: 150.0
  levels_per_side: 1
  level_spacing_bps: 10.0
  post_only: true

risk:
  max_gross_exposure_usd: 80.0
  max_daily_loss_usd: 6.0
  max_drawdown_pct: 0.06
  mindshare_widen_threshold: 1.4
  mindshare_halt_threshold: 2.8
  toxic_flow_markout_bps: -10.0
  toxic_flow_addon_bps: 15.0
  max_feed_age_sec: 30.0

# MindForge $100 Live-Data Paper Trading Config (Hyperliquid Mainnet Public Data)
#
# Uses REAL live Hyperliquid L2 order books, live trades, and live funding rates.
# Strictly honest fill simulation: resting quotes ONLY fill when real market trades
# or live book prices actually touch/cross our resting quote price.
#
# Real Hyperliquid Tier-0 Retail Fee Accounting:
# - Maker fee: +1.5 bps (0.015%)
# - Taker fee: +4.5 bps (0.045%)
# - Hyperliquid L1 order/cancel gas: $0.00 / tx (gasless L1)
# - One-time Arbitrum -> Hyperliquid USDC bridge gas: $0.15

agent_name: mindforge-100usd-live-paper

vault:
  mode: paper
  starting_equity_usd: 100.0

execution:
  venue: hyperliquid
  dry_run: true
  hyperliquid_testnet: false
  maker_fee_bps: 1.5
  taker_fee_bps: 4.5
  gas_fee_per_tx_usd: 0.0          # Hyperliquid L1 order book is gasless
  bridge_gas_usd: 0.15             # One-time Arbitrum USDC bridge gas accounted upfront
  realistic_live_fills: true       # ONLY fill when real trades/book hit our resting quotes
  tick_interval_sec: 1.0

markets:
  - symbol: VIRTUAL
    initial_price: 0.384
    tick_size: 0.00001
    lot_size: 0.1
    min_notional_usd: 10.0         # Real Hyperliquid $10 min order size
    base_order_usd: 12.0           # Capital-light $12 clip for $100 account
    max_position_usd: 35.0
    base_half_spread_bps: 3.0      # Competitive near-touch quoting (above 1.5 bps maker fee)

  - symbol: KAITO
    initial_price: 0.165
    tick_size: 0.00001
    lot_size: 1.0
    min_notional_usd: 10.0
    base_order_usd: 12.0
    max_position_usd: 35.0
    base_half_spread_bps: 4.5

  - symbol: AIXBT
    initial_price: 0.012
    tick_size: 0.000001
    lot_size: 1.0
    min_notional_usd: 10.0
    base_order_usd: 12.0
    max_position_usd: 30.0
    base_half_spread_bps: 7.5

signals:
  mindshare_weight_bps: 6.0
  onchain_weight_bps: 8.0
  forecast_weight: 0.35
  funding_weight: 0.25
  max_fv_shift_bps: 25.0
  rolling_window: 20

quoting:
  inventory_skew_bps: 18.0
  vol_spread_multiplier: 0.45
  instability_spread_bps: 12.0
  instability_size_decay: 0.45
  min_half_spread_bps: 2.5         # Always > 1.5 bps Tier-0 maker fee so round-trips stay positive
  max_half_spread_bps: 150.0
  levels_per_side: 1               # 1 focused level per side to maximize $100 capital efficiency
  level_spacing_bps: 8.0

risk:
  max_gross_exposure_usd: 80.0     # Keep total exposure < 0.8x equity on $100 account
  max_daily_loss_usd: 6.0          # Stop at -$6.00 (-6%) daily loss
  max_drawdown_pct: 0.06           # 6% peak-to-trough kill switch
  mindshare_widen_threshold: 1.4
  mindshare_halt_threshold: 2.8
  toxic_flow_markout_bps: -10.0
  toxic_flow_addon_bps: 10.0
  max_feed_age_sec: 30.0

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindforge"
version = "0.1.0"
description = "Open-source, capital-light AI market-making agent driven by real-time mindshare and on-chain agent activity signals."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "MindForge Contributors" }
]
keywords = [
    "market-making",
    "ai-agents",
    "mindshare",
    "hyperliquid",
    "quantitative-trading",
    "crypto",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "websockets>=12.0",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
hyperliquid = [
    "eth-account>=0.11",
]
llm = [
    # Optional: install whichever agent framework you prefer for custom AttentionForecasters
    "pydantic-ai>=0.0.14",
]

[project.scripts]
mindforge = "mindforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mindforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B027"]
